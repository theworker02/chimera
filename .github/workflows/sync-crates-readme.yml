name: Sync crates.io README links

# When every publishable crate exists at the workspace version on crates.io,
# regenerate the README "Crates.io packages" section (HTML comment markers) and
# commit directly to main when the section changed.
#
# Commits to main (instead of opening a PR) so the job does not depend on the
# repo setting "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    # Hourly — useful during multi-crate first publishes / rate-limit waits.
    - cron: "17 * * * *"
  workflow_dispatch:
  # After a tag release workflow finishes publishing (best-effort; schedule covers gaps).
  workflow_run:
    workflows: ["Chimera Global Release Pipeline"]
    types: [completed]

permissions:
  contents: write

jobs:
  sync-readme:
    name: Sync README crates.io section
    runs-on: ubuntu-latest
    # Skip failed release runs; schedule + dispatch always run.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check crates.io + regenerate README
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          if ! bash scripts/sync-crates-readme.sh --check-only; then
            echo "all_live=false" >> "$GITHUB_OUTPUT"
            echo "Not all crates are LIVE yet — nothing to commit."
            exit 0
          fi
          echo "all_live=true" >> "$GITHUB_OUTPUT"
          bash scripts/sync-crates-readme.sh --require-all
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "README already lists all LIVE crates."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit README update to main
        if: steps.sync.outputs.all_live == 'true' && steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document all crates.io package links after publish"
          git push origin HEAD:main
