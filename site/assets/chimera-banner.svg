    <text x="0" y="18" fill="#A0A4AB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">P2P compute mesh  ·  Wasm  ·  CAS  ·  DSM  ·  agents</text>
