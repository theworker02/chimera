apiVersion: v1
kind: Namespace
metadata:
  name: chimera
---
# Basic Deployment — not a full operator (roadmap). Untested on this host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chimera-node
  namespace: chimera
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chimera
  template:
    metadata:
      labels:
        app: chimera
    spec:
      containers:
        - name: chimera
          image: chimera:0.1.0
          args:
            - --name=$(POD_NAME)
            - --no-tui
            - --mgmt-bind=0.0.0.0:7600
            - --mesh-id=k8s-mesh
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: chimera=info
          ports:
            - name: mgmt
              containerPort: 7600
            - name: tcp
              containerPort: 7400
            - name: quic
              containerPort: 7401
          readinessProbe:
            httpGet:
              path: /health
              port: mgmt
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chimera-mgmt
  namespace: chimera
spec:
  selector:
    app: chimera
  ports:
    - name: mgmt
      port: 7600
      targetPort: 7600
  type: ClusterIP
