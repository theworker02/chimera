[project]
name = "chimera-sdk"
version = "0.1.0"
description = "Async Python client for the Chimera management API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chimera_sdk*"]
