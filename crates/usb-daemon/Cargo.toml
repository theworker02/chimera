[package]
name = "chimera-usb-daemon"
version.workspace = true
edition.workspace = true
description = "Portable Chimera USB-drive worker daemon"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "chimera-usb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chimera = { version = "0.2.0", path = "../..", package = "chimera-mesh", default-features = false, features = ["cnk"] }
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
compiler-jit = { version = "0.2.0", path = "../compiler-jit", package = "chimera-compiler-jit" }
compliance-tee = { version = "0.2.0", path = "../compliance-tee", package = "chimera-compliance-tee" }
