[package]
name = "chimera-memory-fabric"
version.workspace = true
edition.workspace = true
description = "Soft DSM memory fabric and CRDTs for Chimera"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
default = []
userfaultfd = []

[dependencies]
transport-quic = { version = "0.1.0", path = "../transport-quic", package = "chimera-transport-quic" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
