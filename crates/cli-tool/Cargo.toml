[package]
name = "chimeractl"
description = "Chimera enterprise mesh control-plane CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["cli", "mesh", "p2p", "wasm", "chimera"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "chimeractl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
url = "2"
chimera-boot = { version = "0.1.0", path = "../usb-flasher" }

# cargo-binstall: overrides MUST match .github/workflows/release.yml artifact names:
#   chimeractl-linux-amd64, chimeractl-linux-arm64,
#   chimeractl-windows-amd64.exe, chimeractl-macos-universal2
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/chimeractl-linux-amd64"
pkg-fmt = "bin"
[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/chimeractl-linux-arm64"
pkg-fmt = "bin"
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/chimeractl-windows-amd64.exe"
pkg-fmt = "bin"
[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/chimeractl-macos-universal2"
pkg-fmt = "bin"
[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/chimeractl-macos-universal2"
pkg-fmt = "bin"
