[package]
name = "chimera-agent-swarm"
version.workspace = true
edition.workspace = true
description = "Decentralized local decision agents for the Chimera mesh"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
default = []
ml-agent = []

[dependencies]
transport-quic = { version = "0.2.0", path = "../transport-quic", package = "chimera-transport-quic" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
