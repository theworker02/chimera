[package]
name = "chimera-network-bridge"
version.workspace = true
edition.workspace = true
description = "Legacy TCP bridge with serial/Bluetooth stubs for Chimera"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
default = []
bridge-serial = []
bridge-bluetooth = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
