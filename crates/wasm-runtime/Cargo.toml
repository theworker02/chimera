[package]
name = "chimera-wasm-runtime"
version.workspace = true
edition.workspace = true
description = "Sandboxed Wasmtime executor with compute receipts for Chimera"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
default = []
zk-receipts = []

[dependencies]
anyhow = "1"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
parking_lot = "0.12"
rand = "0.8"
transport-quic = { version = "0.2.0", path = "../transport-quic", package = "chimera-transport-quic" }
wasmtime = "29"
uuid = { version = "1", features = ["v4"] }
