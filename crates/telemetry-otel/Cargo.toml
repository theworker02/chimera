[package]
name = "chimera-telemetry-otel"
version.workspace = true
edition.workspace = true
description = "Metrics hub with optional OpenTelemetry export for Chimera"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
anyhow = "1"
parking_lot = "0.12"
transport-quic = { version = "0.1.0", path = "../transport-quic", package = "chimera-transport-quic" }
sysinfo = "0.33"
tracing = "0.1"
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", optional = true, features = ["grpc-tonic"] }
tracing-opentelemetry = { version = "0.28", optional = true }
